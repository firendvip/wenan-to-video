<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>文案 → 视频</title>
<link rel="stylesheet" href="/static/app.css">
</head>
<body>
  <div class="app">
    <header class="bar">
      <div class="brand"><span class="dot"></span>文案<span class="ac">→</span>视频</div>
      <button class="icon-btn" id="openSettings">设置</button>
    </header>

    <section class="composer">
      <textarea id="text" placeholder="粘贴口播文案，⌘/Ctrl+Enter 添加为任务…"></textarea>
      <div class="composer-foot">
        <span class="hint" id="charcount">0 字</span>
        <button class="btn" id="addTask">添加任务</button>
      </div>
    </section>

    <section class="tasks" id="tasks">
      <div class="empty" id="emptyTip">还没有任务。粘贴文案，点「添加任务」。</div>
    </section>
  </div>

  <div class="modal-backdrop" id="settingsModal" hidden>
    <div class="modal">
      <div class="modal-head"><h3>设置</h3><button class="x" id="closeSettings">✕</button></div>
      <div class="modal-body">
        <div class="frow">
          <label>音色文件</label>
          <div class="voice">
            <button class="btn ghost sm" id="voiceBtn">上传 .wav</button>
            <span class="fname" id="voiceName">—</span>
            <input type="file" id="voiceInput" accept=".wav" hidden>
          </div>
        </div>
        <div class="frow">
          <label>语速 <b id="speedVal">1.05×</b></label>
          <input type="range" id="speed" min="0.8" max="1.3" step="0.05">
        </div>
        <div class="frow">
          <label>屏幕方向</label>
          <div class="radios" id="orient"></div>
        </div>
        <div class="frow">
          <label>视频生成路径</label>
          <div class="pathrow">
            <input type="text" id="output" placeholder="~/Desktop/文案视频">
            <button class="btn ghost sm" id="pickFolder">选择文件夹</button>
          </div>
        </div>
      </div>
      <div class="modal-foot">
        <span class="smsg" id="settingsMsg"></span>
        <button class="btn" id="saveSettings">保存</button>
      </div>
    </div>
  </div>

  <script src="/static/app.js"></script>
</body>
</html>
