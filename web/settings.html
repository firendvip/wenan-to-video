<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>设置 · 文案 → 视频</title>
<link rel="stylesheet" href="/static/app.css">
</head>
<body>
  <div class="wrap">
    <header class="masthead">
      <div>
        <div class="kicker">音色 · 语速 · 风格 · 输出</div>
        <div class="title">设置</div>
      </div>
      <nav class="nav"><a href="/">← 返回主页</a></nav>
    </header>

    <section class="panel">
      <h2>音色文件</h2>
      <p class="hint">上传一段清晰的 .wav 人声（约 8 秒）。留空则用默认音色。</p>
      <div class="file-row">
        <input type="file" id="voice" accept=".wav">
        <button class="btn ghost" id="uploadVoice">上传</button>
      </div>
      <div class="file-cur" id="voiceCur" style="margin-top:12px">当前：—</div>
    </section>

    <section class="panel">
      <h2>语速</h2>
      <p class="hint">保持音高的变速，范围 0.8–1.3，默认 1.0。</p>
      <div class="slider-row">
        <input type="range" id="speed" min="0.8" max="1.3" step="0.05" value="1.0">
        <span class="speed-val" id="speedVal">1.00×</span>
      </div>
    </section>

    <section class="panel">
      <h2>视频生成路径</h2>
      <p class="hint">生成完成后自动保存到此文件夹（不存在会自动创建）。</p>
      <label class="field">
        <input type="text" id="output" placeholder="~/Desktop/文案视频">
      </label>
    </section>

    <section class="panel">
      <h2>HTML 风格</h2>
      <p class="hint">六选一，决定竖屏画面的视觉方向。</p>
      <div class="styles-grid" id="styles"></div>
    </section>

    <div class="btn-row">
      <button class="btn" id="save">保存设置</button>
      <a class="btn ghost" href="/">完成</a>
    </div>
    <div class="msg" id="msg"></div>
  </div>
  <script src="/static/settings.js"></script>
</body>
</html>
